[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spock2"
version = "0.1.8"
description = "SPOCK2 – modularer PySide6-Kiosk-Client für RIKER-Bestellungen und CUPS-/WinSpool-Druck"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "SPOCK2 Contributors" }]
keywords = ["riker", "picard", "cups", "winspool", "kiosk", "pos", "kitchen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.6",
    "fonttools>=4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
cups = [
    "pycups>=2.0.1; sys_platform == 'linux'",
]
winspool = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "spock2[cups,winspool]",
]

[project.scripts]
spock2 = "spock2.__main__:main"
spock2-probe-usb = "spock2.diagnostics.probe_usb:main"
spock2-probe-queue = "spock2.diagnostics.probe_queue:main"
spock2-test-print = "spock2.diagnostics.test_print:main"

[project.urls]
Homepage = "https://github.com/JannisRoesner/SPOCK2"
Documentation = "https://github.com/JannisRoesner/SPOCK2#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spock2 = [
    "py.typed",
    "ui/styles.qss",
    "ui/styles_dark.qss",
    "ui/resources/*",
    "printing/fonts/*.ttf",
    "printing/fonts/OFL.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
