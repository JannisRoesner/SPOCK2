name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release mit Build-Artifacts veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

  windows-exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[winspool]"
          pip install "pyinstaller>=6.0"

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller packaging/windows/spock2.spec --noconfirm --clean

      - name: Stage Windows package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if (-not (Test-Path "dist\spock2\spock2.exe")) {
            throw "PyInstaller output missing: dist\spock2\spock2.exe"
          }
          $out = "spock2-${env:VERSION}-windows-amd64"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          # Ordner behalten → nach Entpacken: spock2\spock2.exe (+ Qt-DLLs)
          Compress-Archive -Path "dist\spock2" -DestinationPath "artifacts\$out.zip" -Force
          Get-ChildItem "artifacts" | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: spock2-windows-amd64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  linux-deb:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper dh-python python3-all \
            python3-setuptools python3-pip python3-wheel python3-build \
            dpkg-dev fakeroot
          python3 --version

      - name: Build .deb
        env:
          # Runtime-Deps (PySide6, httpx, …) stehen in debian/control;
          # apt zieht sie auf dem Zielgerät, nicht in diesem Job.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          DEB_PYTHON_INSTALL_LAYOUT: deb
          PYTHONNOUSERSITE: "1"
        run: |
          ln -sfn packaging/deb/debian debian
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          mv ../spock2_*.deb artifacts/
          ls -la artifacts/
          dpkg-deb -f artifacts/spock2_*.deb Package Version Architecture Depends

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: spock2-linux-deb
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30

  linux-rpm:
    needs: version
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio python3-pip python3-setuptools python3-wheel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build RPM (experimental)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          # Spec ist noch Skelett (optional) — Job darf fehlschlagen
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --exclude='.git' --exclude='.venv' --exclude='dist' --exclude='build' \
            --exclude='*.egg-info' --exclude='artifacts' \
            -czf "$HOME/rpmbuild/SOURCES/spock2-${VERSION}.tar.gz" \
            --transform "s,^,spock2-${VERSION}/," .
          sed -e "s/^Version:.*/Version:        ${VERSION}/" \
              -e 's|^# Source0:.*|Source0:        %{name}-%{version}.tar.gz|' \
              packaging/rpm/spock2.spec > "$HOME/rpmbuild/SPECS/spock2.spec"
          sed -i 's/^# %setup -q/%setup -q/' "$HOME/rpmbuild/SPECS/spock2.spec"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/spock2.spec"
          mkdir -p artifacts
          find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -type f -name '*.rpm' -exec cp -v {} artifacts/ \;
          ls -la artifacts/

      - name: Upload RPM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spock2-linux-rpm
          path: artifacts/*.rpm
          if-no-files-found: warn
          retention-days: 14

  python-wheel:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir artifacts
          ls -la artifacts/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: spock2-python-wheel
          path: artifacts/*.whl
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, windows-exe, linux-deb, python-wheel, linux-rpm]
    if: >-
      always() &&
      needs.windows-exe.result == 'success' &&
      needs.linux-deb.result == 'success' &&
      needs.python-wheel.result == 'success' &&
      (
        needs.version.outputs.is_tag == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: spock2-*
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.is_tag == 'true' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          name: SPOCK2 ${{ needs.version.outputs.version }}
          # Tags und manuelle Package-Runs → veröffentlichtes Release (sichtbar auf der Repo-Seite)
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
